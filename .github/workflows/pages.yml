name: Update rankings and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: skills-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install export dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect current Top500
        id: refresh
        if: github.event_name != 'push'
        continue-on-error: true
        run: python update.py
      - name: Preserve rankings and update status
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data site/downloads
          if ! git diff --cached --quiet; then
            git commit -m "Update public skill rankings and status"
            git push
          fi
      - name: Verify published files
        run: python scripts/verify_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Report collection failure after preserving website
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Collection failed. Previous rankings remain available with an error notice.'
          exit 1
